<meta name='viewport' content='width=device-width, initial-scale=1'/> <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HELLO</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1>Hello</h1>
    </header>
    
    <h2>Welcome to My Website</h2>
    
    <nav class="app-nav">
      <a href="#home">Home</a>
      <a href="#settings">Settings</a>
    </nav>

    <main class="app-content">
      <section id="home">
        <p>This is a mobile-friendly app layout.</p>
      </section>
    </main>

    <footer class="app-footer">
      <p>© 2025 Powered by Shopify</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
<style>t/* Reset some default styles */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', sans-serif;
  background-color: #f4f4f4;
  color: #333;
  line-height: 1.6;
  padding: 20px;
}

/* Container */
.app-container {
  max-width: 800px;
  margin: auto;
  background: #fff;
  padding: 30px;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

/* Header */
.app-header h1 {
  color: #2c3e50;
  text-align: center;
  margin-bottom: 20px;
}

/* Subheading */
h2 {
  text-align: center;
  color: #34495e;
  margin-bottom: 20px;
}

/* Navigation */
.app-nav {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 30px;
}

.app-nav a {
  text-decoration: none;
  color: #2980b9;
  font-weight: bold;
  padding: 8px 16px;
  border-radius: 5px;
  transition: background 0.3s;
}

.app-nav a:hover {
  background: #2980b9;
  color: white;
}

/* Main Content */
.app-content {
  padding: 10px;
  text-align: center;
}

/* Footer */
.app-footer {
  text-align: center;
  margin-top: 40px;
  padding-top: 10px;
  border-top: 1px solid #ccc;
  color: #888;
}
/* Default light theme */
body {
  background-color: #f4f4f4;
  color: #333;
  transition: all 0.3s ease;
}

/* Dark theme */
body.dark-mode {
  background-color: #121212;
  color: #e0e0e0;
}

button.toggle-dark {
  margin-top: 20px;
  padding: 10px 15px;
  font-size: 14px;
  border: none;
  border-radius: 5px;
  background: #444;
  color: #fff;
  cursor: pointer;
}

body.dark-mode button.toggle-dark {
  background: #e0e0e0;
  color: #121212;
}
</style><script>document.addEventListener('DOMContentLoaded', () => {
  // Create a button
  const button = document.createElement('button');
  button.textContent = 'Click me!';
  button.style.padding = '10px 20px';
  button.style.marginTop = '20px';
  button.style.fontSize = '16px';

  // Create message element
  const message = document.createElement('p');
  message.id = 'output';
  message.style.marginTop = '15px';

  // On click show message
  button.addEventListener('click', () => {
    message.textContent = 'ধন্যবাদ! আপনি বাটনে ক্লিক করেছেন।';
  });

  // Append to main content
  const mainContent = document.querySelector('.app-content');
  mainContent.appendChild(button);
  mainContent.appendChild(message);

  // Create Dark Mode Toggle
  const toggleButton = document.createElement('button');
  toggleButton.textContent = '🌙 Dark Mode';
  toggleButton.style.marginTop = '20px';
  toggleButton.style.padding = '10px 20px';
  toggleButton.style.fontSize = '16px';
  toggleButton.style.display = 'block';

  // Toggle dark mode
  toggleButton.addEventListener('click', () => {
    document.body.classList.toggle('dark-mode');
  });

  // Append dark mode toggle
  mainContent.appendChild(toggleButton);
});
</script>
